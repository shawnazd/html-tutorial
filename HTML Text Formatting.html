<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Text Formatting</title>
  </head>
  <body>
    <p><b>This is bold text</b></p>
    <p><strong>This is important text</strong></p>

    <p><i>This is italic text</i></p>
    <p><em>This is emphasized text</em></p>

    <p><mark>This is marked/highlighted text</mark></p>

    <p><small>This is smaller text</small></p>

    <p><del>This text is deleted</del></p>
    <p><ins>This text is inserted</ins></p>

    <p>This is subscript: H<sub>2</sub>O</p>
    <p>This is superscript: 10<sup>2</sup> = 100</p>
  </body>
</html>
